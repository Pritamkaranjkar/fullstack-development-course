<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layouts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="brand">Task Manager</div>
      <div class="nav-links">
        <a href="#">Dashboard</a>
        <a href="#">Tasks</a>
        <a href="#">Reports</a>
      </div>
    </nav>

    <main class="page">
      <section class="centered-panel">
        <div class="message-card">
          <h1>Welcome back</h1>
          <p>You have 3 tasks due today.</p>
        </div>
      </section>

      <section class="card-row">
        <article class="card">
          <h2>Inbox</h2>
          <p>Review notes from the sprint kickoff.</p>
        </article>
        <article class="card">
          <h2>Focus</h2>
          <p>Finish the design review before lunch.</p>
        </article>
        <article class="card">
          <h2>Done</h2>
          <p>Ship the bug fix for the mobile menu.</p>
        </article>
      </section>
    </main>
  </body>
</html>
