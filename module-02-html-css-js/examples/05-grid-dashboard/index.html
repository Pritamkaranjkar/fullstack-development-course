<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <h2>Menu</h2>
        <ul>
          <li>Inbox</li>
          <li>Today</li>
          <li>Schedule</li>
        </ul>
      </aside>

      <main class="main-panel">
        <h1>Overview</h1>
        <p>Three tasks are due before noon.</p>
      </main>

      <aside class="stats-panel">
        <h2>Stats</h2>
        <div class="stat">8 tasks</div>
        <div class="stat">2 blocked</div>
        <div class="stat">85% progress</div>
      </aside>
    </div>
  </body>
</html>
