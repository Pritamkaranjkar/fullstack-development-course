<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Task list</h1>

      <form id="task-form">
        <input id="task-input" type="text" placeholder="Add a task" aria-label="Add a task" />
        <button type="submit">Add task</button>
      </form>

      <ul id="task-list" aria-live="polite"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
