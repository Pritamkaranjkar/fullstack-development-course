<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Task highlights</h1>

      <section class="card-grid">
        <article class="card">
          <h2>Design</h2>
          <p>Review the landing page layout for the mobile version.</p>
        </article>
        <article class="card">
          <h2>Build</h2>
          <p>Create the task form for the next sprint demo.</p>
        </article>
        <article class="card">
          <h2>Ship</h2>
          <p>Deploy the first working task-manager prototype.</p>
        </article>
        <article class="card">
          <h2>Measure</h2>
          <p>Check whether the team feels the workflow is clear.</p>
        </article>
      </section>
    </main>
  </body>
</html>
