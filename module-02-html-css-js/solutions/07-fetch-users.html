<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch Users</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8fafc; }
      .app { max-width: 500px; margin: 40px auto; background: white; border: 1px solid #dbeafe; border-radius: 12px; padding: 24px; }
      .status { color: #475569; }
      .status.error { color: #b91c1c; }
      ul { line-height: 1.8; }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Users</h1>
      <p id="status" class="status">Loading...</p>
      <ul id="user-list"></ul>
    </div>

    <script>
      const status = document.querySelector('#status');
      const list = document.querySelector('#user-list');

      async function loadUsers() {
        status.textContent = 'Loading...';

        try {
          const response = await fetch('https://jsonplaceholder.typicode.com/users');
          if (!response.ok) throw new Error('Request failed');

          const users = await response.json();
          list.innerHTML = users.slice(0, 5).map((user) => `<li>${user.name}</li>`).join('');
          status.textContent = 'Users loaded';
        } catch (error) {
          status.textContent = 'Could not load users.';
          status.classList.add('error');
        }
      }

      loadUsers();
    </script>
  </body>
</html>
