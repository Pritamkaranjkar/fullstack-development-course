<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      form { max-width: 500px; margin: 40px auto; background: white; padding: 24px; border-radius: 12px; border: 1px solid #dbeafe; }
      .field { display: grid; gap: 8px; margin-bottom: 16px; }
      input, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
      button { background: #2563eb; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <form>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send message</button>
    </form>
  </body>
</html>
